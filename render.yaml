services:
  # Backend: FastAPI
  - type: web
    name: dine-cast-api
    env: python
    rootDir: minorProj
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"

  # Frontend: Static Site (Vite)
  # Note: While Vercel is recommended, you can also deploy the static site on Render
  - type: static
    name: dine-cast-ui
    env: static
    rootDir: minorProj/frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: dine-cast-api
          type: web
          property: host
